<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble - Chat</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b1220;
      color: #e6e8ee;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: #0f1a30;
      position: sticky;
      top: 0;
    }
    .brand {
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0; }
    .brand .sub { font-size: 12px; color: rgba(230,232,238,0.7); }
    .actions { display: flex; gap: 8px; align-items: center; }
    button {
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #1b2a4a;
      color: #e6e8ee;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }
    button:hover { background: #21355f; }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .panel {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: #0f1a30;
      overflow: hidden;
    }
    #messages {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 60vh;
      overflow: auto;
    }
    #messages li {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
      line-height: 1.35;
    }
    #messages li:last-child { border-bottom: none; }
    .meta { color: rgba(230,232,238,0.7); font-size: 12px; }
    .composer {
      display: flex;
      gap: 10px;
      padding: 12px;
    }
    input {
      flex: 1;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.10);
      background: #0b1326;
      color: #e6e8ee;
      padding: 10px 12px;
      outline: none;
      font-size: 13px;
    }
    input:focus { border-color: rgba(122,162,247,0.65); box-shadow: 0 0 0 3px rgba(122,162,247,0.18); }
    .status {
      padding: 10px 12px;
      font-size: 12px;
      color: rgba(230,232,238,0.75);
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .status.error { color: #ffb4b4; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Bubble</h1>
      <div id="whoami" class="sub"></div>
    </div>
    <div class="actions">
      <button id="logoutBtn" title="Log out">Logout</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <ul id="messages"></ul>
      <div class="composer">
        <input id="msg" placeholder="Type a message..." />
        <button id="sendBtn" title="Send message">Send</button>
      </div>
      <div id="status" class="status">Connecting...</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
  <script>

    /*

    == hardcoded roomId of 123 ==

     */

    const tokenKey = "jwt";
    const jwt = localStorage.getItem(tokenKey);
    if (!jwt) {
      window.location.replace("/login.html");
    }

    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const whoamiEl = document.getElementById("whoami");

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = "status" + (isError ? " error" : "");
    }

    // each time this page loads, run this function
    window.onload = function retrieveMessages() {
      // fetch from this GET endpoint with the jwt in payload for authz
      fetch("/api/chat-history/123/messages", {
        headers: {
          Authorization: "Bearer " + jwt
        }
      })

              /*
        Check if the HTTP response succeeded. If it did,
        start converting the response body from JSON into a JavaScript value,
        then pass that value to the next .then().
        */
         .then(response => {
           if (!response.ok) {
             throw new Error("Previous messages could not be retrieved");
           }

          return response.json();
        })

       // Server returns a list, so the frontend needs to handle it as one
         .then(messages => {
           messages.forEach(message => {
             addMessage(message);
           });
         })
          .catch(error => {
            console.log(error);
          });
    };

    // Where user is attached to message
    function addMessage(data) {
      const li = document.createElement("li");
      const sender = data.sender ? data.sender : "unknown";
      li.textContent = data.content || "";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = sender;
      li.appendChild(meta);
      messagesEl.appendChild(li);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem(tokenKey);
      window.location.replace("/login.html");
    });

    function parseJwtSubject(token) {
      try {
        const [, payloadB64] = token.split(".");
        const payloadJson = atob(payloadB64.replace(/-/g, "+").replace(/_/g, "/"));
        const payload = JSON.parse(payloadJson);
        return payload.sub || "";
      } catch {
        return "";
      }
    }

    const subject = parseJwtSubject(jwt);
    if (subject) {
      whoamiEl.textContent = "Signed in as " + subject;
    }

    const socket = new SockJS("/ws");
    const stompClient = Stomp.over(socket);
    stompClient.debug = null;

    sendBtn.addEventListener("click", send);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });

    function send() {
      const content = msgInput.value.trim();
      if (!content) return;
      stompClient.send("/app/chat/123", {}, JSON.stringify({ content }));
      msgInput.value = "";
      msgInput.focus();
    }

    stompClient.connect(
      { Authorization: "Bearer " + jwt },
      function () {
        setStatus("Connected");
        stompClient.subscribe("/topic/messages/123", function (message) {
          const data = JSON.parse(message.body);
          addMessage(data);
        });
      },
      function (err) {
        setStatus("Disconnected (auth or network). Try logging in again.", true);
      }
    );
  </script>
</body>
</html>
