<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bubble - Register</title>
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0b1220;
            color: #e6e8ee;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .panel {
            width: 100%;
            max-width: 420px;
            background: #0f1a30;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.35);
        }
        h1 {
            margin: 0 0 4px 0;
            font-size: 18px;
            font-weight: 650;
            letter-spacing: 0;
        }
        p {
            margin: 0 0 16px 0;
            color: rgba(230,232,238,0.75);
            font-size: 13px;
            line-height: 1.4;
        }
        label { display: block; font-size: 12px; margin: 10px 0 6px; color: rgba(230,232,238,0.9); }
        input {
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.10);
            background: #0b1326;
            color: #e6e8ee;
            padding: 10px 12px;
            outline: none;
        }
        input:focus { border-color: rgba(122,162,247,0.65); box-shadow: 0 0 0 3px rgba(122,162,247,0.18); }
        .row { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
        button {
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #1b2a4a;
            color: #e6e8ee;
            padding: 10px 12px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }
        button:hover { background: #21355f; }
        button:disabled { opacity: 0.7; cursor: default; }
        .msg {
            margin-top: 12px;
            font-size: 12px;
            color: rgba(230,232,238,0.85);
            min-height: 16px;
        }
        .msg.error { color: #ffb4b4; }
    </style>
</head>


<body>
    <div class="panel">
        <h1>Bubble</h1>
        <p>Register for an account, then enjoy real-time chat rooms</p>

        <form id="registerForm">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required />

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required />

            <div class="row">
                <button id="registerBtn" type="submit">Register</button>
            </div>
        </form>
        <div id="msg" class="msg"></div>
    </div>

    <script>
        const form = document.getElementById("registerForm");
        const registerBtn = document.getElementById("registerBtn");
        const msgEl = document.getElementById("msg");

        function setMsg(text, isError) {
            msgEl.textContent = text || "";
            msgEl.className = "msg" + (isError ? " error" : "");
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            setMsg(""); // clears any previous message
            registerBtn.disabled = true; // disables button, preventing multiple submissions

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    const body = await res.json().catch(() => ({})); // Try to read error as JSON, otherwise use an empty object
                    setMsg(body.error || "Account creation failed", true); // display server error message or "Login failed"
                    return;
                }

                window.location.replace("/login.html");
            } catch (err) {
                setMsg("Network error during registration", true);
            } finally {
                registerBtn.disabled = false; // enables button after success or failure
            }
        });
    </script>


</body>
