<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble - Home</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b1220;
      color: #e6e8ee;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: #0f1a30;
      position: sticky;
      top: 0;
    }
    .brand {
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0; }
    .brand .sub { font-size: 12px; color: rgba(230,232,238,0.7); }
    .actions { display: flex; gap: 8px; align-items: center; }
    button, a.button {
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #1b2a4a;
      color: #e6e8ee;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:hover, a.button:hover { background: #21355f; }
    button:disabled { opacity: 0.7; cursor: default; }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .panel {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: #0f1a30;
      overflow: hidden;
    }
    .panelHeader {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
      font-weight: 650;
    }
    .panelBody {
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .muted { color: rgba(230,232,238,0.7); font-size: 12px; line-height: 1.4; }
    label { display: block; font-size: 12px; margin: 10px 0 6px; color: rgba(230,232,238,0.9); }
    input {
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.10);
      background: #0b1326;
      color: #e6e8ee;
      padding: 10px 12px;
      outline: none;
      font-size: 13px;
    }
    input:focus { border-color: rgba(122,162,247,0.65); box-shadow: 0 0 0 3px rgba(122,162,247,0.18); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .msg {
      font-size: 12px;
      color: rgba(230,232,238,0.85);
      min-height: 16px;
    }
    .msg.error { color: #ffb4b4; }
    .msg.ok { color: #bff0c1; }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <h1>Bubble</h1>
      <div id="whoami" class="sub"></div>
    </div>
    <div class="actions">
      <a class="button" href="/chat.html" title="Open chat (default room)">Chat</a>
      <button id="logoutBtn" title="Log out">Logout</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panelHeader">Home</div>
      <div class="panelBody">
        <div class="row">
          <button id="showCreateBtn" type="button">Create a channel</button>
          <a class="button" href="/channels.html">Join a channel</a>
        </div>
      </div>
    </div>

    <div id="createPanel" class="panel" style="display:none;">
      <div class="panelHeader">Create Channel</div>
      <div class="panelBody">
        <form id="createForm">
          <div class="muted">Owner is derived from JWT (server-side).</div>
          <label for="channelName">Channel name</label>
          <input id="channelName" name="channelName" placeholder="e.g. cs-study-group" required />
          <div class="row" style="margin-top: 12px;">
            <button id="createBtn" type="submit">Create</button>
            <button id="cancelCreateBtn" type="button">Cancel</button>
          </div>
          <div id="createMsg" class="msg"></div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const tokenKey = "jwt";
    const jwt = localStorage.getItem(tokenKey);
    if (!jwt) {
      window.location.replace("/login.html");
    }

    const whoamiEl = document.getElementById("whoami");
    const logoutBtn = document.getElementById("logoutBtn");
    const showCreateBtn = document.getElementById("showCreateBtn");
    const cancelCreateBtn = document.getElementById("cancelCreateBtn");
    const createPanel = document.getElementById("createPanel");
    const createForm = document.getElementById("createForm");
    const createBtn = document.getElementById("createBtn");
    const createMsg = document.getElementById("createMsg");

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem(tokenKey);
      window.location.replace("/login.html");
    });

    function parseJwtSubject(token) {
      try {
        const [, payloadB64] = token.split(".");
        const payloadJson = atob(payloadB64.replace(/-/g, "+").replace(/_/g, "/"));
        const payload = JSON.parse(payloadJson);
        return payload.sub || "";
      } catch {
        return "";
      }
    }

    const subject = parseJwtSubject(jwt);
    whoamiEl.textContent = subject ? `Signed in as ${subject}` : "Signed in";

    function setCreateMsg(text, kind) {
      createMsg.textContent = text || "";
      createMsg.className = "msg" + (kind ? ` ${kind}` : "");
    }

    showCreateBtn.addEventListener("click", () => {
      createPanel.style.display = "block";
      document.getElementById("channelName").focus();
      setCreateMsg("");
    });

    cancelCreateBtn.addEventListener("click", () => {
      createPanel.style.display = "none";
      createForm.reset();
      setCreateMsg("");
    });

    createForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      setCreateMsg("");
      createBtn.disabled = true;

      const channelName = document.getElementById("channelName").value.trim();
      if (!channelName) {
        setCreateMsg("Channel name is required", "error");
        createBtn.disabled = false;
        return;
      }

      try {
        const res = await fetch("/api/channel/create-channel", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + jwt
          },
          body: JSON.stringify({ channelName })
        });

        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          setCreateMsg(body.error || "Channel create failed", "error");
          return;
        }

        setCreateMsg(`Created channel: ${body.name}`, "ok");
        if (body.channelId) {
          window.location.assign(`/chat.html?roomId=${encodeURIComponent(body.channelId)}`);
        }
      } catch (err) {
        setCreateMsg("Network error creating channel", "error");
      } finally {
        createBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
